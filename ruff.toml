# Ruff configuration for MAST_provisioning.
#
# Mirrors the MAST fleet standard (MAST_common, MAST_unit) so every repo formats
# identically. The ruff version is pinned in requirements-dev.txt (ruff==0.16.0);
# config alone is not enough -- both formatter output and the DEFAULT rule set
# differ between ruff versions. Measured while adopting this: the same tree
# reports 13 findings under ruff 0.15.16 defaults and 90 under 0.16.0 defaults.
#
# Unlike MAST_common this repo is not consumed as a sibling clone; its own
# package is `prov` (server/prov/), so that is what isort must treat as
# first-party.

line-length = 125
target-version = "py312"

[lint]
# Enable rules from common linters.
# The short module aliases `logevents as L`, `driver as D`, `transport as T` are a
# deliberate, pervasive convention (~124 call sites across the driver and tests).
# Renaming them is churn with no readability gain, so N812 is off fleet-wide here.
ignore = ["N812"]

extend-select = [
    "F",   # Pyflakes (runtime errors)
    "E",   # pycodestyle (formatting)
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C90", # mccabe complexity
    "SIM", # flake8-simplify
    "TID", # tidy imports
]

# Scoped rather than global, deliberately: these rules stay BLOCKING everywhere
# they are not listed, so new code cannot add to the debt. Each entry names why
# it is here.
#
# NEITHER C901 NOR BLE001 IS WAIVED PER FILE ANY MORE (#72). Both are annotated
# per site -- `# noqa: C901 -- <why>` on the function, `# noqa: BLE001 -- <what
# happens instead>` on the except -- so the rules are live in every file and
# nothing new can arrive unremarked. The blanket form hid real growth: `render` in
# fleet-drift-report.py went from complexity 19 to 35 while its file was exempt.
# Two of the ten C901 annotations mark refactors still owed (#72): `_process_unit`
# at 20 and `render` at 35; each will drop its annotation when it is split.
[lint.per-file-ignores]
# The dev VM harness (vm/): a scenario run drives VirtualBox, WinRM and a guest OS
# through dozens of steps, and a broad catch that reports and continues is how a
# transient guest hiccup avoids killing a 40-minute run. It is developer tooling,
# not production code, and its failure mode is a re-run. (Its broad catches are
# annotated individually now -- only the remaining families are waived here.)
"vm/test-suite.py" = ["S110", "SIM105", "SIM115", "TRY004", "B904"]
"vm/run-prov-test.py" = ["S110", "SIM105", "PLW1510"]

# BLE001 is NO LONGER waived per file (#72). All 34 `except Exception` sites now
# carry a targeted `# noqa: BLE001 -- <what happens instead>`, following the
# pattern driver.py already used, so the rule is live in every file and a new bare
# catch cannot arrive unremarked. The reasons are worth reading rather than
# summarising: 30 of the 34 log, return a failure result, or re-raise from a worker
# thread; 4 stay silent and say why on the line.
#
# S110/SIM105 here are the WinRM session-close and candidate-probe paths, both
# documented in situ as best-effort: whatever requests/urllib3 version is in use,
# close() may raise, and the next call rebuilds the pool anyway.
"server/prov/transport.py" = ["S110", "SIM105"]

# E501 in this file only: the long lines are embedded PowerShell source inside
# Python string literals. Splitting them means concatenating PS across Python
# lines, which risks changing the script that actually gets emitted.
"tools/run-remote-script-winrm.py" = ["E501"]

[lint.isort]
# server/prov/ is imported as `from prov import ...` by the driver, the CLI and
# the tests, which run with server/ on sys.path rather than as an installed
# package. Ruff's path-based resolver therefore cannot classify it, and without
# naming it here every isort run reshuffles the import blocks.
known-first-party = ["prov"]

[format]
# Ruff's Black-compatible formatter.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
